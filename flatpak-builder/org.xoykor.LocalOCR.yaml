# Flatpak manifest for Local OCR (https://github.com/xoykor/Local-OCR)
#
# Built automatically by GitHub Actions via flatpak/flatpak-github-actions
# (see .github/workflows/flatpak.yml). Do NOT build this locally in CI.
#
# The org.freedesktop.Platform/stable runtime ships Python 3 with tkinter
# (python-tk) already bundled, which is exactly what customtkinter needs — so we
# only add a `python` module to install the app's third-party dependencies via
# pip into that same interpreter. No separate Python SDK module is required.
app-id: org.xoykor.LocalOCR
runtime: org.freedesktop.Platform/stable/x86_64
runtime-version: 'stable'
command: main.py

modules:
  - name: python
    build-options:
      env:
        # Make `import app`, `import ocr_service` and `import config` resolve to
        # the files at the repo root (copied into /app by flatpak-builder).
        PYTHONPATH: /app
    build-script: |
      #!/bin/bash
      set -e
      pip install --no-cache-dir \
        "customtkinter>=6.0.0,<7" \
        "Pillow>=10,<12" \
        "PyMuPDF>=1.24.0" \
        "ollama>=0.4.0"
