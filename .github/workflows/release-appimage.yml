name: Build and release AppImage

on:
  push:
    branches:
      - master
    tags:
      - "v*"
      - "flatpak-v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example, v1.0.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set release asset names
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#flatpak-v}"
          version="${version#v}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "appimage=Local-OCR-$version-x86_64.AppImage" >> "$GITHUB_OUTPUT"
          echo "checksum=Local-OCR-$version-x86_64.AppImage.sha256" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2 python3-tk python3-venv wget

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pyinstaller

      - name: Package Python application
        run: >-
          .venv/bin/pyinstaller --noconfirm --clean --windowed
          --name LocalOCR
          --collect-all customtkinter
          --collect-all PIL
          --collect-all pymupdf
          --collect-all ollama
          main.py

      - name: Assemble and build AppImage
        env:
          LDAI_NO_APPSTREAM: "1"
          LDAI_OUTPUT: ${{ steps.release.outputs.appimage }}
          LINUXDEPLOY_OUTPUT_APP_NAME: Local-OCR
          LINUXDEPLOY_OUTPUT_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p AppDir/usr/lib/local-ocr AppDir/usr/bin
          cp -a dist/LocalOCR/. AppDir/usr/lib/local-ocr/
          ln -s ../lib/local-ocr/LocalOCR AppDir/usr/bin/local-ocr
          install -Dm755 packaging/appimage/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          linuxdeploy="$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
          wget --quiet --output-document="$linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x "$linuxdeploy"
          "$linuxdeploy" \
            --appdir AppDir \
            --executable AppDir/usr/lib/local-ocr/LocalOCR \
            --desktop-file packaging/appimage/org.xoykor.LocalOCR.desktop \
            --icon-file packaging/appimage/org.xoykor.LocalOCR.svg \
            --output appimage
          sha256sum "${{ steps.release.outputs.appimage }}" \
            > "${{ steps.release.outputs.checksum }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Local-OCR-${{ steps.release.outputs.version }}-x86_64-AppImage
          path: |
            ${{ steps.release.outputs.appimage }}
            ${{ steps.release.outputs.checksum }}
          if-no-files-found: error

      - name: Publish AppImage to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          APPIMAGE: ${{ steps.release.outputs.appimage }}
          CHECKSUM: ${{ steps.release.outputs.checksum }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APPIMAGE" "$CHECKSUM" --clobber
          else
            gh release create "$RELEASE_TAG" "$APPIMAGE" "$CHECKSUM" \
              --title "Local OCR $RELEASE_VERSION" \
              --generate-notes
          fi
